version: "2.0"
defaultDecision: "CONTINUE_TEST"
defaultConfidence: 0.55

rules:
  - id: "GOV_SRM_RED"
    title: "Sample Ratio Mismatch detected"
    severity: "CRITICAL"
    priority: 100
    when: 'srm_level == "RED"'
    then:
      decision: "ESCALATE"
      confidence: 0.95
    reason: "Traffic split is likely broken (SRM). Results are not trustworthy until assignment/instrumentation is fixed."
    evidence:
      - "SRM signal is RED"

  - id: "NEGATIVE_SIGNIFICANT"
    title: "Treatment B is significantly worse"
    severity: "HIGH"
    priority: 80
    when: 'p_value < 0.05 && uplift_pct < 0'
    then:
      decision: "REJECT"
      confidence: 0.90
    reason: "Statistically significant negative impact detected. Reject treatment B."
    evidence:
      - "p-value < 0.05"
      - "uplift_pct < 0"

  - id: "POSITIVE_SIGNIFICANT"
    title: "Treatment B is significantly better"
    severity: "HIGH"
    priority: 80
    when: 'p_value < 0.05 && uplift_pct >= 2'
    then:
      decision: "IMPLEMENT"
      confidence: 0.90
    reason: "Statistically significant positive impact with meaningful uplift. Implement treatment B."
    evidence:
      - "p-value < 0.05"
      - "uplift_pct >= 2"

  - id: "WEAK_SIGNAL"
    title: "Not enough evidence yet"
    severity: "MEDIUM"
    priority: 10
    when: 'p_value >= 0.05'
    then:
      decision: "CONTINUE_TEST"
      confidence: 0.70
    reason: "Not statistically significant yet. Continue the test or increase sample size."
    evidence:
      - "p-value >= 0.05"
