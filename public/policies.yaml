version: "2.2"
defaultDecision: "CONTINUE_TEST"
defaultConfidence: 0.55

# Precedence (enforced by priority):
# 1) Governance (SRM, expected loss, ROI) -> ESCALATE
# 2) Significant negative -> REJECT_TREATMENT
# 3) Significant positive + practical effect + governance ok -> IMPLEMENT_TREATMENT
# 4) Otherwise -> CONTINUE_TEST

rules:
  # --------------------
  # Governance / Quality (must override everything)
  # --------------------
  - id: "GOV_SRM_RED"
    title: "Sample Ratio Mismatch detected"
    severity: "CRITICAL"
    priority: 1000
    match:
      srm_level: "RED"
    then:
      decision: "ESCALATE"
      confidence: 0.95
    reason: "Traffic split/assignment likely broken. Results are not trustworthy until instrumentation is fixed."
    evidence:
      - "srm_level == RED"

  - id: "GOV_EXPECTED_LOSS_RED"
    title: "Expected loss too high"
    severity: "HIGH"
    priority: 950
    match:
      expected_loss_level: "RED"
    then:
      decision: "ESCALATE"
      confidence: 0.85
    reason: "Downside risk is high. Validate assumptions, run longer, or segment before rollout."
    evidence:
      - "expected_loss_level == RED"

  - id: "GOV_ROI_RED"
    title: "ROI is negative"
    severity: "HIGH"
    priority: 940
    when: 'roi_level == "RED"'
    then:
      decision: "ESCALATE"
      confidence: 0.85
    reason: "ROI is negative. Double-check assumptions, costs, and segment results before rollout."
    evidence:
      - 'roi_level == "RED"'

  # --------------------
  # Negative significant (only if governance is OK)
  # --------------------
  - id: "NEGATIVE_SIGNIFICANT"
    title: "Treatment B is significantly worse"
    severity: "HIGH"
    priority: 700
    when: 'p_value < 0.05 && uplift_pct < 0 && srm_level != "RED"'
    then:
      decision: "REJECT_TREATMENT"
      confidence: 0.90
    reason: "Statistically significant negative impact detected. Reject treatment B."
    evidence:
      - "p_value < 0.05"
      - "uplift_pct < 0"
      - 'srm_level != "RED"'

  # --------------------
  # Positive significant -> implement only when governance is OK
  # --------------------
  - id: "POSITIVE_SIGNIFICANT_IMPLEMENT"
    title: "Treatment B is significantly better (safe to roll out)"
    severity: "HIGH"
    priority: 600
    when: 'p_value < 0.05 && uplift_pct > 0 && effect_size_level != "RED" && srm_level != "RED" && expected_loss_level != "RED" && roi_level != "RED"'
    then:
      decision: "IMPLEMENT_TREATMENT"
      confidence: 0.90
    reason: "Significant positive impact with practical effect size and no red governance risks."
    evidence:
      - "p_value < 0.05"
      - "uplift_pct > 0"
      - 'effect_size_level != "RED"'
      - 'srm_level != "RED"'
      - 'expected_loss_level != "RED"'
      - 'roi_level != "RED"'

  # --------------------
  # Not significant -> continue
  # --------------------
  - id: "NOT_SIGNIFICANT"
    title: "Not statistically significant yet"
    severity: "MEDIUM"
    priority: 100
    when: "p_value >= 0.05"
    then:
      decision: "CONTINUE_TEST"
      confidence: 0.70
    reason: "Not statistically significant yet. Continue the test or increase sample size."
    evidence:
      - "p_value >= 0.05"

  # Optional: promising but underpowered (keeps CONTINUE but gives more helpful reason)
  - id: "PROMISING_BUT_UNDERPOWERED"
    title: "Positive trend but low power"
    severity: "LOW"
    priority: 110
    when: 'p_value >= 0.05 && uplift_pct > 0 && power_level == "RED"'
    then:
      decision: "CONTINUE_TEST"
      confidence: 0.65
    reason: "Positive trend, but power is low. Increase sample size before deciding."
    evidence:
      - "p_value >= 0.05"
      - "uplift_pct > 0"
      - 'power_level == "RED"'

