version: "2.0"
defaultDecision: "CONTINUE_TEST"
defaultConfidence: 0.70

# Decision precedence:
# 1) SRM / governance always wins (ESCALATE)
# 2) If statistically significant negative → REJECT
# 3) If statistically significant positive AND good effect size → IMPLEMENT
# 4) Else → CONTINUE

rules:
  # --------------------
  # Governance / quality
  # --------------------
  - id: "GOV_SRM_RED"
    title: "Sample Ratio Mismatch detected"
    severity: "CRITICAL"
    priority: 1000
    match:
      srm_level: "RED"
    then:
      decision: "ESCALATE"
      confidence: 0.95
    reason: "Traffic split is likely broken (SRM). Results are not trustworthy until assignment/instrumentation is fixed."
    evidence:
      - "SRM signal is RED"

  - id: "GOV_SRM_YELLOW"
    title: "SRM suspicious (needs review)"
    severity: "HIGH"
    priority: 900
    match:
      srm_level: "YELLOW"
    then:
      decision: "ESCALATE"
      confidence: 0.85
    reason: "SRM is suspicious. Validate assignment and tracking before making rollout decisions."
    evidence:
      - "SRM signal is YELLOW"

  # --------------------
  # Negative impact
  # --------------------
  - id: "NEGATIVE_SIGNIFICANT"
    title: "Treatment B is significantly worse"
    severity: "HIGH"
    priority: 800
    when: 'p_value_level == "GREEN" && uplift_pct < 0'
    then:
      decision: "REJECT_TREATMENT"
      confidence: 0.90
    reason: "Statistically significant negative impact detected. Reject treatment B."
    evidence:
      - "p-value < 0.05"
      - "uplift_pct < 0"

  # --------------------
  # Positive impact
  # --------------------
  - id: "POSITIVE_SIGNIFICANT_STRONG"
    title: "Treatment B is significantly better (strong)"
    severity: "HIGH"
    priority: 700
    when: 'p_value_level == "GREEN" && uplift_pct >= 0 && effect_size_level == "GREEN"'
    then:
      decision: "IMPLEMENT_TREATMENT"
      confidence: 0.90
    reason: "Strong statistically significant improvement with meaningful effect size."
    evidence:
      - "p-value < 0.05"
      - "uplift_pct >= 0"
      - "effect size is GREEN"

  - id: "POSITIVE_SIGNIFICANT_WEAK"
    title: "Treatment B is better but effect size is borderline"
    severity: "MEDIUM"
    priority: 650
    when: 'p_value_level == "GREEN" && uplift_pct >= 0 && effect_size_level != "GREEN"'
    then:
      decision: "CONTINUE_TEST"
      confidence: 0.75
    reason: "Significant, but effect size is not strong enough. Consider running longer / segment analysis."
    evidence:
      - "p-value < 0.05"
      - "effect size is not GREEN"

  # --------------------
  # Not significant yet
  # --------------------
  - id: "NOT_SIGNIFICANT"
    title: "Not statistically significant yet"
    severity: "MEDIUM"
    priority: 100
    match:
      p_value_level: "RED"
    then:
      decision: "CONTINUE_TEST"
      confidence: 0.70
    reason: "Not statistically significant yet. Continue the test or increase sample size."
    evidence:
      - "p-value >= 0.05"

